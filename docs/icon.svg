<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- ceasta icon: a scarab beetle. a "bug" for a debugger, a specific object,
       and a shape that still reads at 16px. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22303f"/>
      <stop offset="1" stop-color="#0e1620"/>
    </linearGradient>
    <linearGradient id="shell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd766"/>
      <stop offset="0.55" stop-color="#e9a833"/>
      <stop offset="1" stop-color="#c9871f"/>
    </linearGradient>
    <linearGradient id="shellhi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="1" stop-color="#ffd766" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- rounded tile -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#3a4a5e" stroke-width="1.5"/>

  <g transform="translate(0,-8)">
  <!-- legs (drawn under the body), thick bronze so they read on the dark tile -->
  <g stroke="#7a5320" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M104 108 L58 82 L40 92"/>
    <path d="M100 140 L48 138 L30 150"/>
    <path d="M104 172 L56 190 L42 208"/>
    <path d="M152 108 L198 82 L216 92"/>
    <path d="M156 140 L208 138 L226 150"/>
    <path d="M152 172 L200 190 L214 208"/>
  </g>

  <!-- antennae -->
  <g stroke="#a97a2c" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M116 60 L98 36"/>
    <path d="M140 60 L158 36"/>
  </g>
  <circle cx="96" cy="34" r="8" fill="#c9871f"/>
  <circle cx="160" cy="34" r="8" fill="#c9871f"/>

  <!-- head + pronotum -->
  <ellipse cx="128" cy="72" rx="26" ry="20" fill="#b4801f"/>
  <path d="M100 96 Q128 78 156 96 L150 120 Q128 108 106 120 Z" fill="#c98a20"/>

  <!-- elytra (the shell) -->
  <path d="M128 96
           C 176 96 190 132 190 168
           C 190 210 160 236 128 236
           C 96 236 66 210 66 168
           C 66 132 80 96 128 96 Z" fill="url(#shell)" stroke="#7a5214" stroke-width="4"/>
  <!-- centre seam -->
  <path d="M128 100 L128 232" stroke="#7a5214" stroke-width="5" stroke-linecap="round"/>
  <!-- segment ridges -->
  <g stroke="#9c6c18" stroke-width="3.5" opacity="0.75" fill="none" stroke-linecap="round">
    <path d="M92 128 Q128 138 164 128"/>
    <path d="M86 168 Q128 180 170 168"/>
    <path d="M96 206 Q128 216 160 206"/>
  </g>
  <!-- specular highlight -->
  <path d="M110 108 C 92 116 86 140 90 160 C 104 138 110 122 122 108 Z" fill="url(#shellhi)" opacity="0.7"/>
  </g>
</svg>
