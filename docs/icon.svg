<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- ceasta icon: a flat beetle ("bug" for a debugger). plain, centered,
       no gradients, reads down to 16px. -->

  <!-- tile -->
  <rect x="16" y="16" width="224" height="224" rx="40" fill="#1e2732"/>
  <rect x="16.5" y="16.5" width="223" height="223" rx="39.5" fill="none" stroke="#313d4c" stroke-width="1"/>

  <!-- legs: flat, symmetric, well inside the tile -->
  <g stroke="#9a7a3a" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M96 110 L60 92"/>
    <path d="M92 138 L52 138"/>
    <path d="M96 166 L60 190"/>
    <path d="M160 110 L196 92"/>
    <path d="M164 138 L204 138"/>
    <path d="M160 166 L196 190"/>
  </g>

  <!-- antennae -->
  <g stroke="#c8a24a" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M118 66 L104 48"/>
    <path d="M138 66 L152 48"/>
  </g>
  <circle cx="102" cy="46" r="6" fill="#c8a24a"/>
  <circle cx="154" cy="46" r="6" fill="#c8a24a"/>

  <!-- head -->
  <circle cx="128" cy="74" r="17" fill="#c8a24a"/>

  <!-- elytra: one flat shape, centered, with a plain center seam -->
  <rect x="86" y="90" width="84" height="118" rx="42" fill="#e0aa42"/>
  <line x1="128" y1="96" x2="128" y2="202" stroke="#1e2732" stroke-width="6" stroke-linecap="round"/>
</svg>
