name: build

# every push: build + test on linux and windows, make the installer and try it.
# a v* tag (or a manual run with release_tag set) also publishes a github release.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "publish a release with this tag, like v0.6.0 (leave empty to only build)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  linux:
    name: linux - build + cli package
    # the oldest supported ubuntu, so the binary runs on its glibc and anything newer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: package the command line tool
        run: |
          version=$(sed -n 's/^#define CEASTA_VERSION "\(.*\)"/\1/p' src/version.h)
          name=ceasta-cli-$version-linux-x64
          mkdir -p dist/$name
          cp build/ceasta-cli README.md LICENSE docs/CHANGELOG.md docs/THIRD_PARTY_NOTICES.md dist/$name/
          cp -r plugins dist/$name/
          tar -C dist -czf dist/$name.tar.gz $name

      - uses: actions/upload-artifact@v4
        with:
          name: ceasta-linux
          path: dist/*.tar.gz

  linux-gui:
    name: linux - gui appimage
    # the oldest supported ubuntu: the appimage runs on anything with this glibc or newer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: install glfw + opengl
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglfw3-dev libgl1-mesa-dev xvfb
      - name: build the gui
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCEASTA_LINUX_GUI=ON
          cmake --build build --target ceasta --parallel
          test -x build/ceasta && echo "the linux gui built and linked"

      - name: package an appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1" # no fuse on the runners
        run: |
          version=$(sed -n 's/^#define CEASTA_VERSION "\(.*\)"/\1/p' src/version.h)
          out=ceasta-$version-linux-x64.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/share/doc/ceasta dist
          cp build/ceasta AppDir/usr/bin/
          cp -r plugins AppDir/usr/bin/plugins
          cp README.md LICENSE docs/CHANGELOG.md docs/THIRD_PARTY_NOTICES.md AppDir/usr/share/doc/ceasta/
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          LDAI_OUTPUT=dist/$out ./linuxdeploy --appdir AppDir -e AppDir/usr/bin/ceasta \
            -d packaging/linux/ceasta.desktop -i packaging/linux/ceasta.png --output appimage
          test -x dist/$out

      - name: try the appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          app=$(ls dist/*.AppImage)
          $app --version
          # it has to come up and keep running (a window, opengl, the plugins): still alive after 10 s
          set +e
          timeout 10 xvfb-run -a -s "-screen 0 1280x800x24" $app build/ceasta
          code=$?
          set -e
          test $code -eq 124 && echo "the gui ran until it was stopped"

      - uses: actions/upload-artifact@v4
        with:
          name: ceasta-linux-gui
          path: dist/*.AppImage

  windows:
    name: windows - msvc, installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: build (cmake + msvc)
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: microsoft/setup-msbuild@v2

      - name: the visual studio solution builds too
        run: |
          msbuild ceasta.sln /p:Configuration=Release /p:Platform=x64 /m /v:minimal
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path build\msvc\Release\ceasta.exe)) { exit 1 }
          if (-not (Test-Path build\msvc\Release\plugins\hello.lua)) { exit 1 }

      - name: install inno setup if the image doesn't have it
        run: |
          if (-not (Get-Command iscc.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: package (portable zip + installer)
        run: powershell -ExecutionPolicy Bypass -File installer\package.ps1 -SkipBuild

      - name: test the installer (silent install, checks, uninstall)
        run: powershell -ExecutionPolicy Bypass -File installer\test-install.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ceasta-windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  release:
    name: publish github release
    needs: [linux, linux-gui, windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
          version="${tag#v}"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          # release notes: this version's changelog section plus install steps
          awk -v v="$version" '$0 ~ "^## v"v"( |$)" {f=1; next} /^## / {f=0} f' docs/CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## download

          - **ceasta-$version-setup.exe** - installer for windows 10/11 x64. installs for your user without admin rights, adds a start menu entry and (optionally) "open with ceasta" to the right-click menu.
          - **ceasta-$version-windows-x64.zip** - portable, unzip and run \`ceasta.exe\`.
          - **ceasta-$version-linux-x64.AppImage** - the gui for linux (x64, ubuntu 22.04 or newer and the like): \`chmod +x\` it and run it. if your system has no fuse, run it with \`--appimage-extract-and-run\`.
          - **ceasta-cli-$version-linux-x64.tar.gz** - the command line tool for linux: analysis, disassembly, the decompiler, a terminal debugger (\`ceasta-cli dbg\`), binary diff, library signatures, lua scripting, and the mcp server (\`ceasta-cli mcp\`) for connecting an ai.

          checksums are in SHA256SUMS.txt.
          EOF
          publish() {
            gh release create "$tag" dist/* --title "ceasta $version" --notes-file notes.md --target "$GITHUB_SHA"
          }
          if ! gh release view "$tag" >/dev/null 2>&1; then
            publish
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # a manual re-run replaces the release, so tag, notes and files all come from this commit
            gh release delete "$tag" --yes --cleanup-tag
            for i in 1 2 3 4 5; do
              publish && exit 0
              sleep $((i * 5))
              gh release delete "$tag" --yes --cleanup-tag >/dev/null 2>&1 || true # a half made one
            done
            exit 1
          else
            gh release upload "$tag" dist/* --clobber
          fi
